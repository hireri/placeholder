name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64, cargo_flags: "" }
          - { os: windows-latest, name: windows-x64, cargo_flags: "--no-default-features" } # no music videos on Windows yet
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Submodules (sparse)
        run: |
          git submodule update --init --depth 1 --filter=blob:none
          ./sparse.sh
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client }
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libxkbcommon-dev libwayland-dev libssl-dev
      - name: Last.fm key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          mkdir -p daemon/src/main/resources
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_SECRET" > daemon/src/main/resources/lastfm.properties
      - name: Daemon
        run: ./gradlew :daemon:installDist
      - name: Bundled JRE
        run: |
          lib=daemon/build/install/daemon/lib
          mods=$(jdeps -R --print-module-deps --ignore-missing-deps --multi-release 21 --class-path "$lib/*" $lib/daemon.jar)
          jlink --add-modules "$mods,java.naming,java.sql,jdk.unsupported,jdk.crypto.ec,jdk.charsets" --strip-debug --no-header-files --no-man-pages --compress zip-6 --output dist/jre
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        # The app reads its version from Cargo.toml (update check, "What's new"); the tag is the only place it is set.
        run: sed -i "0,/^version = .*/s//version = \"${GITHUB_REF_NAME#v}\"/" client/egui-app/Cargo.toml
      - name: Client
        run: cargo build --release --manifest-path client/Cargo.toml --workspace ${{ matrix.cargo_flags }}
      - name: Package
        run: |
          pkg=serafin-desktop-${{ github.ref_name }}-${{ matrix.name }}
          mkdir -p "dist/daemon"
          cp -r daemon/build/install/daemon/. dist/daemon/
          cp client/target/release/serafin* dist/
          rm -f dist/*.d dist/*.pdb
          if [ "$RUNNER_OS" = Linux ]; then cp client/egui-app/packaging/serafin.desktop client/egui-app/packaging/serafin.png dist/; fi
          if [ "$RUNNER_OS" = Linux ]; then
            # AppImage with zsync update info, so Gear Lever / AppImageUpdate can follow new releases. The system still supplies GTK/WebKit/ALSA.
            sudo apt-get install -y zsync
            mkdir -p AppDir/usr
            cp -r dist AppDir/usr/bin
            cp client/egui-app/packaging/serafin.desktop client/egui-app/packaging/serafin.png AppDir/
            ln -s serafin.png AppDir/.DirIcon
            printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/serafin" "$@"\n' > AppDir/AppRun
            chmod +x AppDir/AppRun
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run -u "gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|Serafin-*x86_64.AppImage.zsync" AppDir Serafin-x86_64.AppImage
          fi
          mv dist "$pkg"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$pkg.zip" "$pkg" >/dev/null; else tar czf "$pkg.tar.gz" "$pkg"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            serafin-desktop-*.zip
            serafin-desktop-*.tar.gz
            Serafin-*.AppImage
            Serafin-*.AppImage.zsync

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.2.3-anything is a prerelease
