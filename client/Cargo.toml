[workspace]
resolver = "2"
members = ["login", "egui-app"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

# egui layout and image decoding are unusably slow at opt-level 0; optimize dependencies, keep our crates incremental.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
