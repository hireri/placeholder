[package]
name = "metrolist-egui"
version = "0.0.0"
edition = "2021"

[dependencies]
# glow (OpenGL) instead of the default wgpu: far lower idle RAM/VRAM for a 2D UI; no accesskit (system_fonts stays for CJK fallback; Inter has no CJK glyphs).
eframe = { version = "0.37", default-features = false, features = ["persistence", "glow", "default_fonts", "system_fonts", "clipboard", "links", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["svg", "http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json.workspace = true
ureq.workspace = true
serde.workspace = true
cpal = "0.18"
symphonia = { version = "0.6", features = ["mkv", "isomp4", "aac"] }
opus = "0.4"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }

[features]
default = ["video"]
# Music videos in the player (needs GStreamer 1.x with a VP9/H.264 decoder, e.g. gst-libav). `--no-default-features` builds without it.
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }
