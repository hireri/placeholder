[package]
name = "serafin"
version = "0.0.0"
edition = "2021"

[dependencies]
# glow (OpenGL) instead of the default wgpu: far lower idle RAM/VRAM for a 2D UI; no accesskit (system_fonts stays for CJK fallback; Inter has no CJK glyphs).
eframe = { version = "0.37", default-features = false, features = ["persistence", "glow", "default_fonts", "system_fonts", "clipboard", "links", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["svg", "http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json.workspace = true
ureq.workspace = true
serde.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse"] }
cpal = "0.18"
symphonia = { version = "0.6", features = ["mkv", "isomp4", "aac"] }
opus = "0.4"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
discord-rich-presence = "1.1.0"

[features]
default = ["video"]
# Music videos in the player (needs `ffmpeg` on PATH at runtime). `--no-default-features` builds without it.
video = []

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
